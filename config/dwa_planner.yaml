    forced_straight_manual_max_yawrate: 0.30 # 直行覆盖下手动并行转向的最大角速度，单位rad/s
    # 刀2(10.10)防抖锥直通化：true=非接管 valid_straight 路径手动转向直通原始手柄w，
    # 不再按锥角比例压缩小转向；false=恢复旧防抖锥压缩。安全闸不受影响。
    forced_straight_manual_passthrough: true # 直行覆盖手动转向是否直通，true/false
    # 既有DWA兼容/诊断速度表；实际原厂档位线速度和角速度由0x81档位字段执行。
    gear_peak_speeds: [0.70, 1.00, 1.20, 1.40, 1.67] # 各挡位峰值速度列表，单位m/s
    # 档位闭环只改变程序内部的有效档位，不修改控制器原始档位反馈。
    gear_closed_loop_enabled: true # 是否启用前方距离触发的有效档位闭环
    gear_restore_hysteresis: 0.10 # 前方恢复开阔后恢复实际档位所需的滞回距离，单位m
    gear_force_level: 1 # 进入前方减速距离后强制使用的档位
    gear_force_forward_only: true # 是否只允许前进意图触发强制低档，触发后跨动作保持
    gear_front_trigger_extra_angle_deg: 0.0 # gear-only expanded angle in degrees; does not affect DWA
    gear_restore_hold_cycles: 10 # consecutive clear cycles before restoring raw gear
    gear_transition_step_sec: 0.50 # per-gear interval during obstacle gear transition; inactive outside closed loop
    gear_transition_safety_margin: 0.05 # gear-only dynamic trigger margin; does not change DWA distance
    gear_speed_transition_enabled: true # 仅档位闭环手动路径启用实际线速度过渡
    gear_speed_transition_duration_sec: 1.6 # 档位闭环进入/退出的线速度过渡时长，单位s
    # 运动分支按 S=基础距离+霍尔实际速度*比例 计算一级减速起点。
    moving_prebrake_base_distance: 0.90 # 运动预减速的基础触发距离，单位m
    moving_prebrake_speed_ratio: 1.60 # 霍尔实速折算到预减速距离的比例
    moving_prebrake_target_speed: 0.6944 # 预减速阶段目标速度，单位m/s（2.5km/h）
    moving_prebrake_deceleration: 0.60 # 预减速使用的减速度，单位m/s²
    # 9.27 距离比例减速：接近正前障碍时按净距线性减速（替代两档制恒定避障档
    # ——0.6944 与满速 0.70 几乎相等，实测观察不到减速直接冲到障碍跟前）。
    # 净距 >= far 满速；far -> zero 线性下降；净距 <= zero 目标 0（硬停/脱困接手）。
    # 净距回升时目标按 recovery_acceleration 平滑恢复（防净距噪声速度抖动）。
    # 9.27 晚间实测修订：zero 1.00 -> 0.40——旧值让车在障碍 1m 外就压到
    # 8cm/s 爬行（体感"一走一停"）；0.40 只在真正贴近时才停，中段保持
