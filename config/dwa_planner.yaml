    moving_release_hysteresis: 0.80 # 解除阈值相对DWA触发距离的封顶滞回，单位m
    moving_dwa_speed_limit: 0.6944 # DWA接管期线速度上限，单位m/s（2.5km/h）
    moving_dwa_force_gear: true # MOVING_DWA阶段使用控制器原生一档协议
    moving_dwa_gear_level: 1
    # 未进入DWA但物理整车1m圆形范围内有障碍物时，独立强制协议一档（已停用）。
    near_obstacle_gear_enabled: false
    near_obstacle_gear_center_x: 0.38 # 含脚踏/脚尖整车物理包络中心，相对base_link，单位m
    near_obstacle_gear_center_y: 0.0
    near_obstacle_gear_radius: 1.00 # 进入近障碍物限档的圆半径，单位m
    near_obstacle_gear_release_radius: 1.10 # 释放近障碍物限档的圆半径，单位m
    near_obstacle_gear_level: 1
    # 独立限速环：仅对完整倒车、纯左右横推及前进半区左右横推附近窄角触发。
    # 正前进及红区外的前进转弯不触发；圆内通过控制器档位协议切到1档。
    stationary_turn_ring_enabled: true
    stationary_turn_ring_outer_radius_m: 1.00 # 外圆内强制控制器1档，并将线速度限制在1档范围，单位m
    stationary_turn_ring_inner_radius_m: 0.91 # 内圆内线速度再限制为1档速度的一半，单位m
    stationary_turn_ring_forward_side_angle_deg: 10.0 # 从左右横推方向向前的红区角度
    stationary_turn_ring_inner_speed_ratio: 0.50 # 内圆速度上限相对1档速度的比例
    # 动态制动为控制、规划和电机响应预留的时间与距离。
    moving_prebrake_reaction_sec: 0.30 # 预减速反应时间，单位s
    moving_prebrake_safety_margin: 0.05 # 预减速安全余量，单位m
    # 预减速输出保持连续，距离不足时只提高每秒允许下降的Y值。
    moving_prebrake_y_down_rate_min: 30.0 # 预减速输出Y的最小下降速率，单位Y/s
    moving_prebrake_y_down_rate_max: 80.0 # 预减速输出Y的最大下降速率，单位Y/s
    moving_prebrake_y_rate_release: 60.0 # 预减速解除时Y的恢复速率，单位Y/s
    moving_hall_speed_filter_alpha: 0.35 # 霍尔速度滤波系数
    # 控制器反馈档位无效或过期时使用的安全回退档位。
    controller_gear_fallback: 1 # 无效或过期时使用的默认档位
    # 静止起步近障判定Ls：车体前边缘到50cm宽方向检测区内最近真实命中点的净距。
    static_start_distance: 0.50 # 静止起步近障判定距离，单位m
    # 静止近障模式每0.1s按最近雷达距离、0.70m/s上限和K计算Vdwa。
    static_vdwa_gain: 2.50 # 静止起步动态速度增益
    static_vdwa_recalculate_sec: 0.10 # 静止起步动态速度重算周期，单位s
    # 以70度为侧前边界，左右分别覆盖到车体后方180度。
    side_detection_angle_deg: 20.0 # 侧边保护相对前向边界角，单位deg
    manual_turn_forward_min_angle_deg: 65.0 # 手动转向判定的最小前向角，单位deg
    manual_turn_forward_max_angle_deg: 115.0 # 手动转向判定的最大前向角，单位deg
    # Side hard stop uses only fused real radar points, not DWA scoring.
    side_hard_stop_circle_enabled: true # 是否启用侧边硬停止圆形保护
    side_hard_stop_sweep_enabled: false # Predictive side sweep off; direct side-circle stop stays on
    # 圆心前移以覆盖车体前半部、脚踏板和脚尖安全区，保留车尾后部的非保护区域。
    side_hard_stop_circle_center_x: 0.30 # 侧边硬停止保护圆心x坐标，单位m
    side_hard_stop_circle_center_y: 0.0 # 侧边硬停止保护圆心y坐标，单位m
    side_hard_stop_circle_radius: 0.50 # 侧边硬停止保护圆半径，单位m
    side_hard_stop_reverse_escape_yawrate: 0.08 # 倒车侧边硬停时叠加的反向脱困角速度，单位rad/s
    # 侧边扫掠使用左右轮霍尔角速度，并将远期风险转换为角速度限幅。
    side_hard_stop_wheel_track_m: 0.50 # 左右驱动轮轮距，单位m
    side_hard_stop_sweep_prediction_sec: 0.45 # 侧边扫掠保护的预测时间，单位s
    # 仅在霍尔实速预计于该制动窗口内进入圆形区域时执行硬停。
    side_hard_stop_sweep_brake_sec: 0.25 # 侧边扫掠硬停的制动窗口，单位s
    side_hard_stop_sweep_min_yawrate: 0.15 # 侧边扫掠保护生效的最小角速度，单位rad/s
    # 前方硬停止时，仅在左右至少一侧有足够净距时低速脱困。
    front_hard_stop_escape_enabled: true # DWA内部硬停止脱困启用
    radar_contact_distance: 0.065 # D6最小量程饱和判定；仅前方保护区域内不大于该距离时触发前进硬停止，单位m
    hard_stop_release_clear_cycles: 3 # 硬停止解除前要求连续无硬停止条件的周期数
    front_hard_stop_escape_min_clearance: 0.10 # 前方硬停允许脱困所需的最小侧向净距，单位m
    front_hard_stop_escape_linear_speed:  0.00 # DWA内部脱困只输出角速度，线速度固定为0
    front_hard_stop_escape_yawrate:  0.50 # DWA内部脱困角速度，单位rad/s
    stop_escape_trigger_sec: 0.00 # DWA内部连续硬停止触发时间，单位s
    near_obstacle_yawrate_limit_enabled: false # 关闭近障碍物时的手动角速度0.70rad/s限幅；侧扫掠保护与硬停止仍生效
    # 普通DWA线速度使用非对称加减速斜坡；急停分支不经过该斜坡。
    dwa_velocity_ramp_enabled: true # 是否启用普通DWA输出速度斜坡
    # 霍尔实速超过1.20m/s时，当前或预测侧距进入30cm便平滑限到1.20m/s。
    side_speed_trigger: 99.0 # 侧边动态限速的实速触发阈值（99=停用侧边限速）
    side_speed_target: 1.20 # 侧边动态限速的目标速度，单位m/s
    side_limit_distance: 0.30 # 侧边动态限速触发距离，单位m
    side_prediction_reaction_sec: 0.25 # 侧边距离预测的反应时间，单位s
    side_prediction_deceleration: 1.50 # 侧边动态限速使用的减速度，单位m/s²
    side_closing_rate_filter_alpha: 0.35 # 侧向接近速度滤波系数
    side_closing_rate_max: 1.00 # 侧向接近速度最大限值，单位m/s
    # 两侧都回到30cm外并保持0.30s后再平滑恢复手柄速度。
    side_cap_release_distance: 0.30 # 侧边限速解除所需的最小安全距离，单位m
    side_cap_release_clear_sec: 0.30 # 侧边限速解除前需要保持安全的时间，单位s
    side_target_down_rate: 1.50 # 侧边限速目标速度下降速率，单位m/s²
    side_target_up_rate: 0.20 # 侧边限速目标速度恢复速率，单位m/s²
    # 20cm内限制继续向墙转；预测净距低于20cm且另一侧大于20cm时主动向外修正。
    side_wall_hold_enabled: true # 是否启用侧墙保持控制
    side_wall_hold_distance: 0.20 # 侧墙保持开始限制内侧转向的距离，单位m
    side_wall_hold_correction_distance: 0.20 # 侧墙保持主动向外修正的距离，单位m
    # 侧距还在变小时，提前看0.60s；预测会进入20cm就开始平缓往外修正。
    side_wall_hold_prediction_sec: 0.60 # 侧墙保持的前视预测时间，单位s
    # 雷达偶尔丢一个侧边点时，短时间沿用最近有效距离，避免补偿突然清零。
    side_wall_hold_invalid_hold_sec: 0.25 # 侧边点短暂失效时保持旧距离的时间，单位s
    # 只接管前进区边缘的轻微偏角，强手动转向仍走25cm停止保护。
    side_wall_hold_forward_margin_deg: 5.0 # 侧墙保持允许接管的前向角余量，单位deg
    side_wall_hold_release_distance: 0.22 # 侧墙保持解除距离，单位m
    side_wall_hold_kp: 0.80 # 侧墙距离误差比例增益
    side_wall_hold_min_yawrate: 0.04 # 侧墙保持最小修正角速度，单位rad/s
    side_wall_hold_max_yawrate: 0.12 # 侧墙保持最大修正角速度，单位rad/s
    side_wall_hold_yaw_accel: 0.25 # 侧墙保持角速度变化率，单位rad/s²
    side_wall_hold_release_sec: 0.30 # 侧墙保持解除前需要持续安全的时间，单位s
    # 保留git基线的释放机制：超过对应接管距离后立即退出DWA，不额外增加距离和时间。
    dynamic_release_margin: 0.0 # 动态DWA解除接管的额外距离余量，单位m
    dynamic_release_clear_sec: 0.0 # 动态DWA解除接管前需要保持安全的时间，单位s
    speed_restore_side_clearance: 0.20 # 恢复高速时左右侧均需大于此距离，单位m
    speed_restore_sweep_clearance: 0.45 # 恢复高速时车体前向扫掠区需大于此距离，单位m
    speed_restore_stable_sec: 1.0 # 全部安全条件连续满足此时间后才恢复高速，单位s
    speed_restore_max_yawrate: 0.12 # 恢复高速要求车体/行驶方向稳定，允许角速度，单位rad/s
    # 保留给RViz距离线的基础显示宽度，按实测车体宽度设置。
    front_corridor_width: 0.59 # 前方通道参考显示宽度，单位m
    # 前方 DWA 触发区从左右雷达中心线开始，几何选簇使用同一套外扩梯形。
    front_trigger_start_x: 0.50 # 前方DWA触发区域起始x坐标，单位m
    front_trigger_base_width: 0.59 # 前方DWA触发区域基础宽度，单位m
    front_trigger_expand_angle_deg: 5.0 # 前方触发区域随距离扩展的角度，单位deg
    # 控制器X/Y中心为100，89～111范围内视为死区。
    controller_x_dead_low: 89 # 控制器X轴死区下限
    controller_x_dead_high: 111 # 控制器X轴死区上限
    controller_y_dead_low: 89 # 控制器Y轴死区下限
    controller_y_dead_high: 111 # 控制器Y轴死区上限

    # 霍尔轮速反馈超时，只用于DWA当前线速度估计。
    hall_feedback_timeout_sec: 0.25 # 霍尔轮速反馈超时时间，单位s

    # 没有 /cmd_vel_raw 时可临时设为 0.30~0.50，只用于 RViz 看轨迹，不接电机。
    debug_nominal_speed: 0.0 # 无控制器输入时的调试名义速度，单位m/s
    # true 表示强制使用 debug_nominal_speed；实车接电机必须保持 false。
    force_debug_intent: false # 是否强制使用调试名义速度
    # DWA 点云裁剪的最小 x，保留少量车后点用于观察，不参与主动后退。
    planning_min_x: -0.15 # 参与DWA点云裁剪的最小x坐标，单位m
    # DWA 点云裁剪的最大横向范围，防止远处侧向无关点撑乱 RViz。
    planning_max_abs_y: 2.50 # 参与DWA点云裁剪的最大横向绝对范围，单位m
    # RViz 候选轨迹抽稀显示比例。越小显示越密，RViz 越乱。
    marker_stride: 6 # RViz候选轨迹显示抽稀步长
    # 打印 DWA 候选轨迹评分摘要：Top N 有效轨迹 + 无效轨迹原因统计。
    # 正式电机模式关闭逐轨迹评分日志，预览调试时再显式开启。
    log_trajectory_scores: false # 是否输出DWA候选轨迹评分摘要
    # 实车模式由 start_dwa_motor_test.sh 关闭；预览模式保持开启。
    # 正式电机模式不序列化RViz数据，start_dwa_preview.sh会显式打开。
    publish_debug_visualization: false # 是否发布RViz调试可视化数据
    trajectory_score_top_n: 10 # 评分日志中输出的有效轨迹数量
    trajectory_score_log_interval_ms: 1000 # 评分日志输出间隔，单位ms

    # Migrated 8.21 corridor guidance only; short-term map intentionally omitted.
    dwa_corridor_guide_enabled: false # 关闭通道参考线引导，完全由DWA基于融合点云避障
    # 通道检测从雷达前更近处开始，避免车头已接近通道口时边缘点被提前排除。
    dwa_corridor_search_start_x: 0.25 # 通道搜索起始x坐标，单位m
    dwa_corridor_search_end_x: 1.80 # 通道搜索结束x坐标，单位m
    # 最小通道宽度由完整车体宽度加该余量动态计算，最终安全性仍由DWA碰撞预测确认。
    dwa_corridor_min_width_margin: 0.04 # 通道最小宽度相对车体宽度的额外余量，单位m
    dwa_corridor_max_width: 1.30 # 允许识别的最大通道宽度，单位m
    dwa_corridor_search_half_width: 1.20 # 通道搜索区域的横向半宽，单位m
    # 欧氏聚类和通道门几何约束只负责生成候选，最终碰撞安全仍由原始DWA验证。
    dwa_corridor_cluster_gap_distance: 0.14 # 通道点聚类的最大点间间隙，单位m
    dwa_corridor_cluster_min_points: 3 # 通道边界聚类所需的最少点数
    dwa_corridor_gate_max_depth_difference: 0.50 # 通道门两端允许的最大深度差，单位m
    dwa_corridor_gate_blocking_clearance: 0.10 # 通道门判定的阻塞净距阈值，单位m
    dwa_corridor_gate_endpoint_exclusion: 0.12 # 通道门端点排除距离，单位m
    dwa_corridor_gate_dedup_distance: 0.16 # 通道门去重距离，单位m
    dwa_corridor_gate_projection_length: 0.75 # 通道门投影长度，单位m
    # 中心线参考点前移到近场检测起点，入口角度由base_link原点单独计算。
    dwa_corridor_approach_start_x: 0.25 # 通道中心线接近段起始x坐标，单位m
    # 手柄仅前推时按入口中心到前参考点的真实距离选最近通道；明确带方向时方向优先。
    dwa_corridor_explicit_intent_ratio: 0.15 # 明确手柄方向意图的最小比例
    dwa_corridor_max_heading_deg: 60.0 # 通道入口允许的最大航向角，单位deg
    dwa_corridor_intent_lateral_range: 0.70 # 手柄意图横向映射范围，单位m
    dwa_corridor_stable_cycles: 3 # 通道状态激活前需要连续稳定的周期数
    dwa_corridor_lost_hold_cycles: 4 # 通道短暂丢失时保持状态的周期数
    dwa_corridor_track_lateral_tolerance: 0.35 # 通道中心线跟踪横向容差，单位m
    dwa_corridor_track_heading_tolerance_deg: 25.0 # 通道中心线跟踪航向容差，单位deg
    dwa_corridor_path_filter_alpha: 0.35 # 通道参考线滤波系数
    dwa_corridor_trajectory_lookahead: 1.20 # 通道参考线的轨迹前视距离，单位m
    # 通道中心线只作为原始DWA的连续软评分，不直接接管速度或过滤轨迹。
    dwa_corridor_lateral_weight: 2.00 # 通道横向偏差软评分权重
    dwa_corridor_heading_weight: 0.70 # 通道航向偏差软评分权重
    dwa_corridor_progress_weight: 0.35 # 通道前进进度软评分权重


# 融合节点与 DWA 共用同一套雷达外参与坐标参数；这里只做一次 LaserScan->base_link 转换。
laser_scan_fusion:
  ros__parameters:
    left_scan_topic: /dwa/scan_left_filtered
    right_scan_topic: /dwa/scan_right_filtered
    output_topic: /dwa/fused_scan_base
    frame_id: base_link
    left_laser_x: 0.545
    left_laser_y: 0.280
    left_laser_yaw: -1.5707963267948966
    left_laser_angle_reversed: false
    left_laser_angle_offset_deg: 0.0
    right_laser_x: 0.545
    right_laser_y: -0.280
    right_laser_yaw: 1.5707963267948966
    right_laser_angle_reversed: false
    right_laser_angle_offset_deg: 0.0
