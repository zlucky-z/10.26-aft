    # 边界抖动顿挫已废（014339 定案）；更远的减速由 DWA 评分层自行处理。
    bypass_near_zone_far_distance: 1.20 # H2 近障锁存触发净距（前方1.2m内锁1档避障），单位m
    # A3(10.09)：1档避障释放侧净距门控，单位m。用户定案"锁存后通道内
    # 不允许提速"：释放须前方净空(>1.50 连续防抖)且 两侧任一侧净距>
    # 本值。1m 窄弯里视线穿过弯道开口时 fwd 真实跳 3m+（040707 实锤
