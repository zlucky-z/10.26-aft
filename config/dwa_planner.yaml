    # "贴窗顶推进最优"，差速转向有力，窗心 v 自锁环被打破。
    scoring_manual_turn_min_yawrate: 0.50 # 方案A激活的打杆门槛 rad/s（0=禁用）
    scoring_manual_turn_speed_gain: 0.80 # 方案A速度罚增益（仅激活期参与评分）
    # 方案C：意图方向候选全判死时输出冻结(0,0)（同 no_valid_trajectory 路径），
    # 不再选反向小弧——推左出右"不受控"根除。同号候选仍活时不触发。
    intent_freeze_min_yawrate: 0.00 # 关闭意图方向全判死时的零速冻结
    # 原DWA只负责确定绕行大方向；二次选择只在同方向有效轨迹中匹配几何目标角。
    dwa_geometric_selector_enabled: false # 是否启用DWA几何二次轨迹选择
    # 9.24 转向修复：几何二次选择关闭。原 8° 航向增长帽在低速下把角速度
    # 限到接近零；转弯过大问题改由障碍代价软边距（obstacle_cost_free_margin）
