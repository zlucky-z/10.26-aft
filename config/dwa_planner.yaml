    # 锁存最小净距保持低速（dvf_maintain_front_latch），不再瞬间回满速。
    moving_prebrake_profile_far_distance: 2.20 # 距离比例减速满速边界净距，单位m
    # A3b(10.09)：0.40→0.20。045814 实锤：1m 弯道里前净距天然 0.2~0.6m（弧形
    # 墙真实观测），040 时代 B1 全程压速（压速段占 71%，通道均速 1.8km/h），
