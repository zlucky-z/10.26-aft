    collision_veto_max_sec: 2.00 # 判死视界上限，单位s
    clearance_horizon_m: 1.60 # 净距视界弧长封顶，单位m（低速端自动=刹车视距+0.30m）
    to_goal_cost_gain: 0.80 # 目标方向代价权重
    speed_cost_gain: 0.40 # 速度代价权重
    path_cost_gain: 0.40 # 路径代价权重
    # 当前控制链没有全局路径；速度和路径代价保持上游可选项的关闭状态。
    use_speed_cost: false # 是否启用速度代价
    use_path_cost: false # 是否启用全局路径代价
    # 10.10 方案A+C（003347 定案：窄缝塌缩段 74% 评分自选 raw_v=sel_v=0 双零、
    # 强打杆 31% 输出近零、6% 输出与意图反向——A5 证明旁路 target 恒 0.70 无
    # 压制，必须动评分层）。
    # 方案A：近障锁存+强打杆+前推时临时打开速度代价（仅该周期评分副本）：
