# 模块功能：DWA节点全部运行参数；修改算法阈值、车体尺寸、雷达安装位或安全策略时优先查看此文件。
# 修改提示：本文件只负责上述职责，修改参数或流程时先确认上下游接口。
dwa_local_planner:
  ros__parameters:
    # 左右滤波雷达先在融合节点中转到 base_link；DWA 只读取最终融合点云。
    fused_cloud_topic: /dwa/fused_scan_base # base_link 下的统一融合点云
    # 控制器原始意图话题。控制器不推时 DWA 不应主动前进。
    cmd_vel_raw_topic: /cmd_vel_raw # 控制器发布的原始速度意图话题
    # 电机桥反馈原始手柄XY和轮速；静止起步只读取其中的原始Y值。
    motor_feedback_topic: /dwa/motor_feedback # 电机桥发布的原始手柄和轮速反馈话题
    # 规划节点向电机桥发布霍尔闭环开关、目标速度和控制阶段。
    hall_speed_control_topic: /dwa/hall_speed_control # DWA向电机桥发布霍尔速度控制状态的话题
    # 轮速/里程计话题。当前没有稳定 odom 时，DWA 会用控制器意图近似当前速度。
    odom_topic: /odom # 里程计话题，用于获取当前运动速度
    # DWA 输出候选速度，电机桥读取这个话题。
    output_topic: /dwa/cmd_vel_candidate # DWA向电机桥发布候选速度的话题
    # 车体坐标系。所有左右雷达点都会转换到这个坐标系后再参与规划。
    frame_id: base_link # DWA使用的车体坐标系名称

    # 左雷达安装位置，单位 m/rad。x 为车头方向，y 为左侧方向。
    left_laser_x: 0.545 # 左雷达相对车体原点的前后安装位置，单位m
    left_laser_y: 0.290 # 左雷达相对车体原点的左右安装位置，单位m
    left_laser_yaw: -1.5707963267948966 # 左雷达相对车体坐标系的安装偏航角，单位rad
    left_laser_angle_reversed: false # 左雷达扫描角度顺序是否需要反向
    left_laser_angle_offset_deg: 0.0 # 左雷达扫描零角度修正，单位deg
    # 右雷达安装位置，单位 m/rad。y 为负数表示右侧。
    right_laser_x: 0.545 # 右雷达相对车体原点的前后安装位置，单位m
    right_laser_y: -0.290 # 右雷达相对车体原点的左右安装位置，单位m
    right_laser_yaw: 1.5707963267948966 # 右雷达相对车体坐标系的安装偏航角，单位rad
    right_laser_angle_reversed: false # 右雷达扫描角度顺序是否需要反向
    right_laser_angle_offset_deg: 0.0 # 右雷达扫描零角度修正，单位deg
    # 左右雷达统一转换到 base_link 后的空间去重半径

    # 车体坐标以左右后驱动轮轴心中点为原点，主体、脚踏板和脚尖安全区分层建模。
    # 主体矩形到脚踏板后缘；脚踏板和脚尖安全区使用下方独立窄包络。
    footprint_front: 0.50 # 主体车体包络的最前方x坐标，单位m
    footprint_back: 0.14 # 主体车体包络的最后方x坐标，单位m
    footprint_half_width: 0.295 # 主体车体包络的半宽，单位m（车体总宽0.59m）
    footrest_start_x: 0.57 # 脚踏板包络开始的x坐标，单位m
    footrest_front_x: 0.75 # 脚踏板包络最前方x坐标，单位m
    footrest_half_width: 0.23 # 脚踏板包络的半宽，单位m
    toe_safety_front_x: 0.90 # 脚尖安全包络最前方x坐标，单位m
    toe_safety_half_width: 0.23 # 脚尖安全包络的半宽，单位m
    # 车体额外安全膨胀。当前先设为 0，避免过度保守导致走不动。
    footprint_padding: 0.0 # 车体碰撞包络额外膨胀量，单位m
    # 自车过滤主体只到主体前缘，0.50m 到脚踏板后缘之间按实测几何保留为真实开放区。
    self_filter_body_front_x: 0.50 # 自车点过滤使用的主体前缘x坐标，单位m
    # 真实车架和脚踏板自车点的过滤余量，只影响点云/栅格自过滤，不改变 DWA 碰撞外形。
    footprint_self_filter_padding: 0.05 # 自车点过滤的额外余量，单位m
    # 骑乘者身体区自点过滤：从速度模块清距和 DWA 障碍表里剔除骑乘者
    # 腿部自反射点（膝盖实测x≈1.11、脚尖实测x≈0.83），修复骑行时永久
    # 压速与转向失效问题。骑乘点随车同动，与障碍"世界中静止"仿真矛盾。
    # 注意：不影响安全诊断（禁转区/侧边点集/侧硬停）——9.24 曾把过滤
    # 扩到安全诊断并将起点下探 0.50，实测转向剧烈抖动，已回滚。
    # 9.27 对齐 9.20 基线：基线障碍表无骑乘过滤；该宽过滤区把近距
    # （<0.59m）宽墙整面删掉导致正前避障失效，先关闭实测。
    # 9.27 R3：S弯实测（054326）膝盖点回障碍表（fwd恒距0.35~0.75最长
    # 21圈、0.5m桶391圈），clearance 0.34~0.54 越过软边距在近平局评分里
    # 逐圈翻转天平加重乱转。恢复过滤剔膝盖；撞墙风险由"速度模块已关+
    # DWA全程在场远距绕行+R1/R2转向果断+硬停链(看全量点)"兜底。
    # 9.27 F2(a)（放开全部限速实测后）：过滤区盲区带复发——宽墙进带
    # 从障碍表消失，DWA满速valid冲到墙前触发硬停(0,+0.50)脱困，再满速
    # 再硬停，体感"反复加减速、最后不能动"。对齐 9.20 基线关闭过滤；
    # 膝盖点回表风险同上由 DWA 全程在场+R1/R2+硬停链兜底。
    # 9.27 F3（070820 实测后）：关过滤的代价回显——膝盖/脚尖点把前向
    # 轨迹批量判废（valid 108→3，空旷场fwd=9.8m也中招），脚稍岔开即
    # 原地急转反向偏转；骑行全程 valid 21~43 压制加减速反复。恢复过滤
    # + 新增宽簇墙闸：带内出现横向≥0.40m连续簇（墙）时本周期停用过滤，
    # 盲区带不再复发；窄簇（膝盖/脚尖）仍正常剔除。代价：带内细杆类
    # 障碍会被过滤（硬停链仍看全量点兜底）。
    # Fix H(9.28)：关闭骑乘过滤带，对齐 9.11-ok 基线（基线无此带）。
    # 窄墙 |y|≤0.35 与骑乘带同区域，F3 墙闸→Fix E→F→G 四轮补丁均
    # 未解决窄通道蹭墙；跨车身观测已恢复直通（robot_main Fix H）。
    # 代价=膝/脚点作为前方障碍（基线行为，保守减速）。
    rider_self_filter_enabled: false # 骑乘者身体区自点过滤（Fix H 关闭回基线）
    rider_self_filter_start_x: 0.76 # 骑乘者过滤区起始x坐标（碰撞前缘），单位m
    rider_self_filter_front_x: 1.35 # 骑乘者过滤区最前x坐标（膝盖最前位置+余量），单位m
    rider_self_filter_half_width: 0.35 # 骑乘者过滤区半宽，单位m
    rider_filter_cluster_gap: 0.15 # 带内点y排序聚类的最大点间间隙，单位m
    rider_filter_preserve_width: 0.40 # 判定"墙"的最小簇横向宽度（≥此值本周期停用过滤），单位m

    # 9.27 速度模块总开关（A/B 实测用）：
    # true  = 速度融合状态机（HAND/PREBRAKE/HOLD/SIDE_CAP/STATIC）。
    # false = 速度模块整体旁路：前进意图+感知新鲜 ⇒ DWA 直接接管，
    #         速度上限恒为 forward_speed_limit，档位透传原始档；
    #         硬停止/倒车/原地转向走原安全通道。
    dynamic_velocity_fusion_enabled: false # 是否启用速度融合状态机

    # 6.18 版本角度脚区屏蔽：先在左右雷达各自原始扫描角度内处理，再融合到 DWA 栅格。
    # 命中条件只包含扫描角度和距离，不叠加 local_x、车体系坐标或 footprint 判断。
    local_foot_mask_enabled: false # 是否启用雷达原始扫描中的脚部角度屏蔽
    local_foot_mask_max_range: 0.40 # 脚部角度屏蔽的最大距离，单位m
    left_local_foot_angle_min_deg: 10.0 # 左雷达脚部屏蔽的最小扫描角，单位deg
    left_local_foot_angle_max_deg: 90.0 # 左雷达脚部屏蔽的最大扫描角，单位deg
    right_local_foot_angle_min_deg: -90.0 # 右雷达脚部屏蔽的最小扫描角，单位deg
    right_local_foot_angle_max_deg: -10.0 # 右雷达脚部屏蔽的最大扫描角，单位deg

    # DWA只使用两路雷达负责的前方扇区，跳过后方和重复扫描区域。
    # 按 ROS LaserScan 正角度为左侧的约定，左右规划扇区对称覆盖前方。
    left_planning_angle_min_deg: 30.0 # 左雷达参与DWA规划的最小角度，单位deg
    left_planning_angle_max_deg: 180.0 # 左雷达参与DWA规划的最大角度，单位deg
    right_planning_angle_min_deg: -180.0 # 右雷达参与DWA规划的最小角度，单位deg
    right_planning_angle_max_deg: -30.0 # 右雷达参与DWA规划的最大角度，单位deg

    # DWA 轨迹和前向碰撞评估参考点：左右雷达中间的车头中线点。
    trajectory_reference_x: 0.50 # DWA轨迹碰撞评估参考点的x坐标，单位m
    trajectory_reference_y: 0.0 # DWA轨迹碰撞评估参考点的y坐标，单位m

    # 双雷达共同投影到这张局部占用栅格；射线扫过为空闲，命中为占用，未扫到保持未知。
    grid_resolution: 0.05 # 局部占用栅格分辨率，单位m
    grid_min_x: -0.80 # 局部占用栅格的最小x范围，单位m
    grid_max_x: 3.60 # 局部占用栅格的最大x范围，单位m
    grid_max_abs_y: 3.00 # 局部占用栅格的最大横向绝对范围，单位m
    # 关闭栅格膨胀，避免5cm栅格向两侧额外缩窄真实通道。
    grid_inflation_radius: 0.0 # 占用栅格向外膨胀半径，单位m
    # 未观测格不直接阻塞车辆；真实命中点和完整车体包络负责碰撞检查。
    # 若设为 true，双雷达射线之间残留的未知格会让全部候选轨迹失效，车辆无法起步。
    grid_unknown_is_obstacle: false # 是否把未观测栅格视为障碍物
    # 9.24: 轨迹碰撞评估已只查点云空间桶（不查栅格），建图链成为纯开销。
    # false=跳过射线清空/占据标记/footprint清除/膨胀/诊断扫描（栅格尺寸仍保留，
    # 障碍点表边界检查依赖它）。对拍或RViz需要看栅格时改回 true。
    occupancy_grid_build_enabled: false

    # 启动初值；运行后由动态状态机把每周期Vdwa写入DWA的max_velocity。
    max_velocity: 0.70 # DWA当前最大前进线速度，单位m/s
    # 原始DWA动态窗口允许的最低前进速度，不再强制抬高低速候选。
    min_velocity: 0.0 # DWA候选允许的最低前进线速度，单位m/s
    # 后退不进入DWA规划；倒车标尺与前进标尺一致，完整保留手柄原始幅度。
    max_reverse_velocity: 0.70 # 允许的最大倒车线速度，单位m/s
    # 候选轨迹展开参数：先让 RViz 中能明显看到左右绕行候选，不改评分权重。
    max_yawrate: 1.40 # DWA候选允许的最大角速度，单位rad/s
    # 低速转弯候选的最小角速度，来自上游DWA原始采样规则。
    min_yawrate: 0.05 # 非直行候选采用的最小角速度，单位rad/s
    # 线速度加速度限制。越大越容易从低速提升到目标速度。
    # G2(10.09)：1.00→1.50，窗口顶每 tick +0.15（原 +0.10）——贴停/转弯后
    # 速度恢复快一半，配合 G1 减少摇摇车"爬→冲"循环的低谷期。判死视界
    # 不用加速度，风险仅在起步顿挫，实测验证。
    max_acceleration: 1.50 # DWA线速度最大加速度，单位m/s²
    # 线速度减速度限制。越大越容易快速降速。
    max_deceleration: 1.50 # DWA线速度最大减速度，单位m/s²
    # G1(10.09)：采样窗口下界专用减速度（仅影响候选窗口 v_low，判死视界
    # T_veto=|v|/max_deceleration+reaction 与输出斜率限制仍用 max_deceleration）。
    # 根因：两者共用 1.50 时拐角断崖窗口 [0.55,0.70] 候选全死→fallback(0,0)
    # →实速崩 0→窗口锚定实速塌缩 [0,0.10]→sel 钉死 0.10 爬行（005931：44 次
    # 贴停、25% 时间 <0.3m/s）。3.00×0.10=0.30/tick 下探，断崖时窗口
    # [0.40,0.70] 保留中间刹车候选，sel 走 0.70→0.40→0.20 阶梯而非全死归零。
    # <=0 或缺省退回 max_deceleration（原行为）。
    sampling_deceleration_window: 3.00 # DWA采样窗口下界专用减速度，单位m/s²
    # 角速度变化限制。越大，候选轨迹左右展开越明显。
    # 10.08 纠错：9.24 曾按"回到 9.20 基线值"改为 3.2，经核对 9.11-ok 基线实为 12.0
    # （150 共享原始包），属 C 重构时误降。0.7m/s 下窗口半宽 0.32 需 4 周期(0.4s)
    # 才能爬到满舵，出弯纠偏盲走 ~28cm；恢复 12 后单周期可达 ±1.2（仍受 max_yawrate=1.40 钳位）。
    max_d_yawrate: 12.00 # 角速度最大变化率，单位rad/s²
    # 轨迹预测时间固定2s；可用ros2 param set热更新，但不会随速度自动变化。
    predict_time: 2.00 # DWA轨迹预测时长，单位s
    # 轨迹仿真步长。越小越精细，但计算更多。
    sim_dt: 0.10 # 轨迹仿真时间步长，单位s
    # DWA 控制周期估计，用于动态窗口速度变化范围。
    control_period: 0.10 # DWA动态窗口使用的控制周期，单位s
    # A4(10.09)：IMU 角速度闭环补偿（ltw 基线实车验证方案移植）。
    # DWA 接管期（MOVING_DWA）以 bmi270(/dev/i2c-3) gz 为反馈，对发布
    # 角速度做 P 阻尼+小积分+斜率限幅，补偿档位强制 1 档后的底板执行
    # 缺口（051608 实测：通道内 selw 0.14 物理仅转 ~0.06，弯道转不过来）。
    # IMU 初始化失败自动旁路（行为同旧版）。
    yaw_feedback_enabled: true # IMU 角速度闭环补偿开关
    # gz 符号约定：+1=左转 gz>0（与 w>0 一致）。上车验证：手推左转看
    # 日志 [路径规划] gyroz，若为负改 -1。
    imu_gz_sign: 1.0 # IMU 陀螺 z 轴符号（+1/-1）
    # ---- A4b(10.09)：补偿强度 yaml 化（首版过补：宽走廊拖曳+通道转大）。
    # ltw 原标定基准=1档0.35权限车；本项目 w_max=1.40 → w_scale=4.0 是根因之一。
    # 以下键缺省/负值时用代码默认（与当前值相同），改值后 push yaml+重启即生效。
    yaw_feedback_gain_follow: 0.30 # P 跟随增益（ltw 0.40→0.30 纠偏变柔）
    yaw_feedback_gain_kill: 0.50 # P 压制增益（压过转，暂不动）
    yaw_feedback_fight_margin: 0.08 # 压制触发余量 rad/s（走廊仍拖曳可试 0.12）
    yaw_feedback_integ_max_frac: 0.15 # 积分上限=w_max×此值（ltw 0.35→0.15，上限0.49→0.21）
    yaw_feedback_integ_release: 0.70 # 积分无需求泄漏/拍（ltw 0.85→0.70 退快一倍）
    yaw_feedback_ref_w_max: 0.70 # w_scale 分母（ltw 0.35→0.70，即 w_scale 4.0→2.0 权限减半）
    # 10.09 方案①：手柄豁免快率阈值。|打杆角|≥此值且建转朝手柄方向时，
    # 建转斜率走快率(0.40/拍)——治"避障触发后打杆有 0.3~1.2s 延迟"（慢斜坡
    # 只服务 DWA 自动弧平滑，人主动打方向不该被拦）。0=禁用豁免。
    yaw_feedback_manual_slew_min_theta: 0.10
    # 低于该线速度时，对非直行候选应用min_yawrate；原生w=0候选仍单独保留。
    slow_velocity_threshold: 0.10 # 低速转弯候选判定阈值，单位m/s
    # 线速度采样数量。越多候选越密，计算更多。
    # 9.24 性能修复：7→4，配合角速度 27，候选总数 357→112，对齐 9.20 基线量级。
    velocity_samples: 4 # 线速度采样数量
    # 角速度采样数量。越多左右候选轨迹越密，RViz 更容易看清。
    yawrate_samples: 27 # 角速度采样数量
    # 调用线程加三个OpenMP工作线程共同计算候选轨迹，评分归一化仍保持原顺序。
    planning_worker_count: 4 # DWA并行规划线程数量
    # DWA 参与计算的最大障碍物距离。
    # 10.08 恢复：2.5→3.5 恢复 9.11-ok 基线值（9.24 性能修复时曾收窄）。
    # +1m 视距让弯道口内侧墙更早进入障碍表，缓解提前转；空间桶索引下计算量可承受。
    obstacle_range: 3.50 # 参与DWA计算的最大障碍物距离，单位m
    # 控制器方向意图映射到前方目标点的距离。
    intent_lookahead: 2.00 # 控制器意图映射的前方目标距离，单位m
    # 控制器角速度意图映射成横向目标偏移的比例。
    # 10.09 刀1：语义改为"意图跟随增益"。目标点=意图弧端点(速度匹配)，
    # 1.0=评分最优转向恒等于意图角速度(任意车速 1:1 跟随，消除直行小角度
    # 死区与 5 档衰减)；>1=目标超越意图更激进；<1=更温和。旧语义(固定
    # 横向偏移比例)已废弃——2.0 隐含按 0.7m/s 标定，5 档衰减至 0.43×。
    intent_yaw_to_lateral: 1.00 # 意图跟随增益（目标点=意图弧端点）

    # 原始DWA代价：所有有效候选先逐项归一化，再乘以下权重求总分。
    obstacle_cost_gain: 1.00 # 障碍物代价权重
    # 9.24 转向修复：障碍代价软边距（对齐 9.20 基线）。净距大于该值时障碍代价
    # 归零——"够安全就平等"，避免障碍还很远就选大转避让；逼近障碍才被惩罚。
    obstacle_cost_free_margin: 0.20 # 障碍代价软边距，单位m
    # 只在直行且两侧净距均>60cm时，前方软避障评分从40→30cm平滑打开；
    # 侧边靠墙时不缩放原评分。硬停止/碰撞否决/速度代价不改；手动转向不介入。
    front_turn_bias_start_m: 0.40 # 前方软评分开始恢复，单位m
    front_turn_bias_full_m: 0.30 # 前方软评分恢复到原强度，单位m
    front_turn_bias_side_clearance_m: 0.60 # 两侧均比此值远才延迟前方评分
    # 10.08 Fix V2→V3c：碰撞判死视距解耦 + 净距渐进罚（双视界）。
    # 判死视界 T_veto=|v|/max_deceleration+reaction_sec（钳 [min,max]）：
    # 视界内碰撞=刹车来不及→否决（通道贴墙防护，与 V2 逐位相同）。
    # 净距视界=min(clearance_horizon_m, 刹车视距弧长+0.30m)：低速短弧
    # （V3b 固定弧长 1.6m 在 v=0.7 通道把修正舵候选的弧线扫到对侧墙
    # 满罚、修正被钳死→骑右墙；065301 实测 L-R +0.090 vs V2 +0.011），
