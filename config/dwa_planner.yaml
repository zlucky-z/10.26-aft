    dwa_geometric_lookahead_distance: 0.50 # 几何二次选择的目标前视距离，单位m
    dwa_geometric_min_lookahead_distance: 0.15 # 几何二次选择允许的最小前视距离，单位m
    dwa_geometric_min_forward_offset: 0.05 # 几何目标点允许的最小前向偏移，单位m
    # 左右雷达点先在base_link中融合聚类，E只从同一最近前方障碍物簇取。
    dwa_geometric_cluster_gap_distance: 0.18 # 最近障碍物聚类的最大点间间隙，单位m
