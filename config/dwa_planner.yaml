    # 驶出通道两侧先张开才恢复档位速度。0=禁用门控（退回 A2 行为）。
    bypass_near_zone_release_side_distance: 0.40
    moving_dwa_trigger_distance: 0.40 # 运动状态进入DWA接管的触发距离，单位m
    # 普通运动分支必须先降到该实速以下，侧边紧急DWA和静止启动不走这个门槛。
    moving_dwa_entry_speed_max: 0.70 # 普通运动进入DWA前要求的最大实速，单位m/s（不得大于max_velocity）
    # 9.24 压速修复：PREBRAKE/HOLD/MOVING_DWA 解除阈值封顶滞回。
    # 解除距离 = min(进入时锁存的预减速距离, moving_dwa_trigger_distance + 本值)。
