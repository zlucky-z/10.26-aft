    dwa_geometric_cluster_forward_window: 0.40 # 障碍物聚类向前沿后方保留的窗口，单位m
    # E 点只允许从最近前沿带内选取，避免使用远端横向极值。
    dwa_geometric_edge_front_band: 0.10 # 最近障碍物前沿带宽，单位m
    dwa_geometric_cluster_track_tolerance: 0.25 # 连续周期障碍簇跟踪横向容差，单位m
    # 只有直推正前方小障碍才先让原DWA起手，宽墙和通道不进入等待状态。
    dwa_geometric_centered_entry_max_width: 0.45 # 直推正前方障碍允许直接进入几何接管的最大宽度，单位m
    dwa_geometric_handoff_stable_cycles: 3 # 几何接管前需要连续稳定的周期数
    dwa_geometric_handoff_heading_agree_deg: 12.0 # 几何接管前方向一致性阈值，单位deg
    dwa_geometric_raw_entry_yawrate: 0.30 # 几何入口使用的原始角速度，单位rad/s
    # 二次轨迹至少保留5cm净距，且相对原DWA最多损失8cm。
    dwa_geometric_min_candidate_clearance: 0.05 # 几何二次选择候选的最小净距，单位m
    dwa_geometric_max_clearance_loss: 0.08 # 相对原DWA允许的最大净距损失，单位m
    # E角度接近0度时仍选择同方向最小充分转角，不回退到原DWA大转弯。
    dwa_geometric_min_target_angle_deg: 0.0 # 几何目标允许的最小目标角，单位deg
    # 近距离小角度时沿原DWA绕障方向补偿目标角，避免正前近障碍只选几度小弯。
    dwa_geometric_near_small_angle_distance: 0.50 # 近距离小角度补偿的触发距离，单位m
    dwa_geometric_small_target_angle_deg: 10.0 # 近距离补偿使用的小目标角，单位deg
    dwa_geometric_near_target_heading_compensation_deg: 7.0 # 近距离目标航向补偿角，单位deg
    # 二次选择相对原始DWA弦方向最多只增加该角度，防止急转放大。
    dwa_geometric_max_heading_growth_deg: 8.0 # 相对原DWA允许增加的最大航向角，单位deg
    # 几何二次选择只接收目标角误差20度以内的轨迹，避免小角目标选到急转轨迹。
    dwa_geometric_max_error_deg: 10.0 # 几何候选允许的最大目标角误差，单位deg
    # 同方向存在安全候选时始终选取最接近E点目标角的轨迹；无候选才回退原DWA。
    # 只有手柄明确给出反向角速度时，才切换到大方向相反的有效候选集合。
    dwa_geometric_manual_override_yawrate: 0.00 # 手柄明确反向时的几何选择角速度覆盖值，单位rad/s
    dwa_geometric_target_filter_alpha: 0.45 # 几何目标角一阶滤波系数
    dwa_geometric_heading_tie_deg: 2.0 # 几何候选角度判定为并列的阈值，单位deg

    # 左右雷达数据超时。超过该时间认为该侧雷达掉线。
    scan_timeout_sec: 0.60 # 雷达数据超时时间，单位s
    # 控制器输入超时。超过该时间 DWA 不再沿旧控制意图继续输出。
    cmd_timeout_sec: 0.50 # 控制器输入超时时间，单位s
    # odom 超时。超过该时间改用控制器意图近似当前速度。
    odom_timeout_sec: 0.50 # 里程计数据超时时间，单位s
    # 控制器线速度死区，小于该值认为没有前进意图。
    deadband_linear: 0.02 # 控制器线速度死区，单位m/s
    # 控制器角速度死区，小于该值认为没有转向意图。
    deadband_angular: 0.02 # 控制器角速度死区，单位rad/s
    # 直行覆盖期间忽略的角速度中位抖动；超过后按手柄角速度并行转向。
    forced_straight_yaw_tolerance: 0.05 # 直行覆盖时允许忽略的角速度抖动，单位rad/s
    # 摇杆相对正前方允许手动并行转向的左右角度；超出后恢复原控制链。
    forced_straight_manual_cone_deg: 45.0 # 直行覆盖允许手动并行转向的角度范围，单位deg
