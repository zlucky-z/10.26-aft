    moving_prebrake_profile_zero_distance: 0.00 # 末端距离归零减速已旁路，保留字段仅兼容旧配置
    moving_prebrake_recovery_acceleration: 0.40 # 净距回升时目标速度恢复加速度，单位m/s²
